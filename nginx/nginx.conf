user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent"';
    access_log /dev/stdout gateway;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Limit compute submissions, not cancellation. X-Real-IP below is always
    # overwritten from the socket peer; forwarded client headers cannot bypass it.
    map $request_method $jump_compute_limit_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $jump_compute_limit_key zone=jump_compute:10m rate=3r/s;

    # Only addresses that cannot be routed from the public Internet are trusted
    # as internal clients. Do not add proxy headers here unless the proxy itself
    # is trusted and ngx_http_realip_module is configured as well.
    geo $internal_client {
        default 0;
        127.0.0.0/8 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
        ::1/128 1;
        fc00::/7 1;
        fe80::/10 1;
    }

    upstream eve_lp_web {
        server web:3000;
        keepalive 16;
    }

    server {
        listen 42981;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        error_page 403 /__security/denied.html;

        location = /__security/denied.html {
            internal;
            root /usr/share/nginx/html;
        }

        location = /__security/assets/deep-space-checkpoint-v2.png {
            alias /usr/share/nginx/html/__security/assets/deep-space-checkpoint-v2.png;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location = /sync {
            if ($internal_client = 0) { return 403; }
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location ^~ /sync/ {
            if ($internal_client = 0) { return 403; }
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location = /api/sync {
            if ($internal_client = 0) { return 403; }
            proxy_set_header X-Sync-Internal-Token "";
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location ^~ /api/sync/ {
            if ($internal_client = 0) { return 403; }
            proxy_set_header X-Sync-Internal-Token "";
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location = /sync-v2 {
            if ($internal_client = 0) { return 403; }
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location ^~ /sync-v2/ {
            if ($internal_client = 0) { return 403; }
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location ^~ /api/v2/ {
            client_max_body_size 21m;
            if ($internal_client = 0) { return 403; }
            proxy_set_header X-Sync-Internal-Token "";
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location = /api/navigation/jump/auto {
            client_max_body_size 16k;
            client_body_timeout 5s;
            limit_req zone=jump_compute burst=16 nodelay;
            limit_req_status 429;
            error_page 429 = @jump_compute_busy;
            error_page 413 = @jump_compute_body;
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
            proxy_set_header X-Jump-Origin-Host $http_host;
        }

        location @jump_compute_busy {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "2" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 429 '{"error":"请求过于频繁，请稍后重试。","code":"JUMP_RATE_LIMIT"}';
        }

        location @jump_compute_body {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 413 '{"error":"自动计算请求过大。","code":"JUMP_BODY_TOO_LARGE"}';
        }

        location = /api/navigation/jump/cancel {
            client_max_body_size 1k;
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
            proxy_set_header X-Jump-Origin-Host $http_host;
        }

        location / {
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }
    }
}
