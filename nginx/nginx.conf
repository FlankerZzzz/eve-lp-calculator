user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent"';
    access_log /dev/stdout gateway;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Only addresses that cannot be routed from the public Internet are trusted
    # as internal clients. Do not add proxy headers here unless the proxy itself
    # is trusted and ngx_http_realip_module is configured as well.
    geo $internal_client {
        default 0;
        127.0.0.0/8 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
        ::1/128 1;
        fc00::/7 1;
        fe80::/10 1;
    }

    upstream eve_lp_web {
        server web:3000;
        keepalive 16;
    }

    server {
        listen 42981;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        error_page 403 /__security/denied.html;

        location = /__security/denied.html {
            internal;
            root /usr/share/nginx/html;
        }

        location = /__security/assets/deep-space-checkpoint.png {
            alias /usr/share/nginx/html/__security/assets/deep-space-checkpoint.png;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location = /__security/assets/deep-space-checkpoint-v2.png {
            alias /usr/share/nginx/html/__security/assets/deep-space-checkpoint-v2.png;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location = /sync {
            if ($internal_client = 0) { return 403; }
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location ^~ /sync/ {
            if ($internal_client = 0) { return 403; }
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location = /api/sync {
            if ($internal_client = 0) { return 403; }
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location ^~ /api/sync/ {
            if ($internal_client = 0) { return 403; }
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }

        location / {
            proxy_pass http://eve_lp_web;
            include /etc/nginx/proxy-common.conf;
        }
    }
}
