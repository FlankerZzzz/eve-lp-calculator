<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>航道权限拒绝 · 403</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #02060b;
      color: #eaf8ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(2, 6, 11, .98) 0%, rgba(2, 8, 15, .88) 36%, rgba(3, 12, 20, .22) 72%),
        url('/__security/assets/deep-space-checkpoint.png') center / cover no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(118, 226, 255, .025) 0 1px, transparent 1px 5px),
        radial-gradient(circle at 78% 45%, transparent 0 18%, rgba(1, 4, 8, .35) 64%, rgba(1, 4, 8, .9) 100%);
    }
    main {
      position: relative;
      z-index: 1;
      width: min(680px, 92vw);
      min-height: 100vh;
      display: grid;
      align-content: center;
      padding: clamp(32px, 7vw, 96px);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #7ee9ff;
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 42px;
      height: 2px;
      background: linear-gradient(90deg, #ffb45b, #75ebff);
      box-shadow: 0 0 18px #59dfff;
    }
    .code {
      margin: 22px 0 0;
      color: transparent;
      font-size: clamp(88px, 18vw, 176px);
      font-weight: 900;
      line-height: .78;
      letter-spacing: -.08em;
      -webkit-text-stroke: 1px rgba(132, 232, 255, .72);
      text-shadow: 0 0 45px rgba(55, 196, 255, .18);
    }
    h1 {
      max-width: 620px;
      margin: 30px 0 14px;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.02;
      letter-spacing: -.035em;
    }
    .lead {
      max-width: 560px;
      margin: 0;
      color: #a9c4d1;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.75;
    }
    .telemetry {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      width: min(520px, 100%);
      margin-top: 34px;
      overflow: hidden;
      border: 1px solid rgba(113, 220, 255, .24);
      background: rgba(96, 216, 255, .18);
      backdrop-filter: blur(14px);
    }
    .telemetry div {
      min-width: 0;
      padding: 13px 15px;
      background: rgba(2, 12, 20, .76);
    }
    .telemetry span,
    .telemetry strong { display: block; }
    .telemetry span {
      margin-bottom: 5px;
      color: #688b9c;
      font: 700 9px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .14em;
    }
    .telemetry strong {
      overflow: hidden;
      color: #d9f7ff;
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-width: 168px;
      margin-top: 28px;
      padding: 12px 18px;
      border: 1px solid rgba(126, 233, 255, .58);
      color: #dffaff;
      background: linear-gradient(135deg, rgba(21, 79, 101, .62), rgba(7, 28, 42, .72));
      box-shadow: inset 0 0 22px rgba(90, 216, 255, .08), 0 0 28px rgba(56, 188, 255, .1);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover { border-color: #ffbd70; color: #fff3df; }
    footer {
      margin-top: 26px;
      color: #527080;
      font: 600 10px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    @media (max-width: 640px) {
      body { overflow: auto; background-position: 62% center; }
      main { min-height: 100svh; padding: 30px 24px; }
      .telemetry { grid-template-columns: 1fr; }
      .code { font-size: 92px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .eyebrow::before { animation: pulse 2.8s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; box-shadow: 0 0 4px #59dfff; } }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Jump Gate Control · Sector 42981</div>
    <div class="code" aria-hidden="true">403</div>
    <h1>跃迁航道未获授权</h1>
    <p class="lead">你的信标来自受信任星域之外。同步控制台仅向本地舰队网络开放；当前航线已被星门安全协议拦截。</p>
    <section class="telemetry" aria-label="访问诊断">
      <div><span>GATE STATUS</span><strong>ACCESS DENIED</strong></div>
      <div><span>ROUTE CLASS</span><strong>SYNC CONTROL</strong></div>
      <div><span>PROTOCOL</span><strong>LOCAL FLEET ONLY</strong></div>
    </section>
    <a href="/">返回公共星图</a>
    <footer>NX-42981 · Navigation firewall active · No hostile action recorded</footer>
  </main>
</body>
</html>
