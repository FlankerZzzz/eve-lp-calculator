<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>航道权限拒绝 · 403</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #02060b;
      color: #eaf8ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(2, 6, 11, .98) 0%, rgba(2, 8, 15, .88) 36%, rgba(3, 12, 20, .22) 72%),
        url('/__security/assets/deep-space-checkpoint-v2.png') center / cover no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(118, 226, 255, .025) 0 1px, transparent 1px 5px),
        radial-gradient(circle at 78% 45%, transparent 0 18%, rgba(1, 4, 8, .35) 64%, rgba(1, 4, 8, .9) 100%);
    }
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 82% 44%, rgba(174, 241, 255, .22) 0, rgba(61, 186, 255, .08) 17%, transparent 38%),
        linear-gradient(103deg, transparent 0 50%, rgba(120, 229, 255, .045) 52%, transparent 54%);
      mix-blend-mode: screen;
      opacity: .76;
    }
    .space-fx,
    .space-fx > div {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particles::before,
    .particles::after {
      content: "";
      position: absolute;
      inset: -18%;
      background-image:
        radial-gradient(circle, rgba(205, 246, 255, .72) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(95, 201, 255, .45) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255, 190, 112, .32) 0 1px, transparent 1.5px);
      background-position: 11px 17px, 43px 71px, 89px 31px;
      background-size: 113px 107px, 167px 151px, 227px 211px;
      opacity: .36;
    }
    .particles::after {
      filter: blur(.5px);
      opacity: .26;
      transform: scale(1.35);
    }
    .stream {
      position: absolute;
      left: 42%;
      width: 48vw;
      height: 1px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(67, 193, 255, .18) 24%, rgba(188, 245, 255, .86) 64%, transparent);
      box-shadow: 0 0 8px rgba(78, 205, 255, .5), 0 0 22px rgba(54, 165, 255, .22);
      opacity: 0;
      transform-origin: 100% 50%;
    }
    .stream:nth-child(1) { top: 39%; transform: rotate(5deg); }
    .stream:nth-child(2) { top: 48%; transform: rotate(-2deg); animation-delay: -1.8s; }
    .stream:nth-child(3) { top: 57%; transform: rotate(-8deg); animation-delay: -3.4s; }
    .stream:nth-child(4) { top: 29%; left: 55%; width: 38vw; transform: rotate(-5deg); animation-delay: -2.7s; }
    .stream:nth-child(5) { top: 69%; left: 48%; width: 42vw; transform: rotate(3deg); animation-delay: -4.2s; }
    .dust::before,
    .dust::after {
      content: "";
      position: absolute;
      inset: -12%;
      opacity: .34;
    }
    .dust::before {
      background:
        radial-gradient(circle at 58% 14%, rgba(209, 248, 255, .78) 0 1px, transparent 2px),
        radial-gradient(circle at 68% 23%, rgba(95, 206, 255, .64) 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 81% 17%, rgba(255, 194, 116, .5) 0 1px, transparent 2px),
        radial-gradient(circle at 91% 31%, rgba(208, 248, 255, .68) 0 1px, transparent 2.5px),
        radial-gradient(circle at 73% 47%, rgba(112, 221, 255, .72) 0 1.5px, transparent 3px),
        radial-gradient(circle at 88% 58%, rgba(255, 205, 137, .44) 0 1px, transparent 2px),
        radial-gradient(circle at 62% 66%, rgba(189, 242, 255, .66) 0 1px, transparent 2.5px),
        radial-gradient(circle at 79% 79%, rgba(100, 208, 255, .58) 0 1.5px, transparent 3px),
        radial-gradient(circle at 94% 86%, rgba(218, 250, 255, .7) 0 1px, transparent 2px),
        radial-gradient(circle at 52% 88%, rgba(255, 185, 104, .38) 0 1px, transparent 2px);
      filter: drop-shadow(0 0 4px rgba(95, 213, 255, .55));
    }
    .dust::after {
      left: 38%;
      background-image:
        radial-gradient(circle, rgba(187, 241, 255, .58) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(76, 187, 255, .4) 0 1px, transparent 2px);
      background-position: 17px 23px, 61px 47px;
      background-size: 83px 79px, 137px 131px;
      filter: blur(.35px);
      mask-image: radial-gradient(ellipse at 76% 48%, #000 0 34%, transparent 76%);
      opacity: .3;
    }
    .mote {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size, 3px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(188, 245, 255, .9);
      box-shadow: 0 0 5px 1px rgba(70, 199, 255, .7), 0 0 13px rgba(54, 153, 255, .35);
      opacity: .28;
    }
    .mote:nth-child(1) { --x: 55%; --y: 18%; --size: 2px; --duration: 9s; --delay: -2s; }
    .mote:nth-child(2) { --x: 64%; --y: 31%; --size: 3px; --duration: 12s; --delay: -7s; }
    .mote:nth-child(3) { --x: 74%; --y: 13%; --size: 2px; --duration: 11s; --delay: -4s; }
    .mote:nth-child(4) { --x: 86%; --y: 25%; --size: 4px; --duration: 14s; --delay: -9s; }
    .mote:nth-child(5) { --x: 94%; --y: 42%; --size: 2px; --duration: 10s; --delay: -5s; }
    .mote:nth-child(6) { --x: 68%; --y: 51%; --size: 3px; --duration: 13s; --delay: -1s; }
    .mote:nth-child(7) { --x: 81%; --y: 61%; --size: 2px; --duration: 9s; --delay: -6s; }
    .mote:nth-child(8) { --x: 91%; --y: 72%; --size: 3px; --duration: 15s; --delay: -11s; }
    .mote:nth-child(9) { --x: 59%; --y: 76%; --size: 2px; --duration: 12s; --delay: -8s; }
    .mote:nth-child(10) { --x: 72%; --y: 86%; --size: 4px; --duration: 16s; --delay: -3s; }
    .mote:nth-child(11) { --x: 88%; --y: 91%; --size: 2px; --duration: 11s; --delay: -10s; }
    .mote:nth-child(12) { --x: 97%; --y: 15%; --size: 3px; --duration: 14s; --delay: -12s; }
    .meteor {
      --angle: -26deg;
      --length: 110px;
      --duration: 13s;
      --delay: 0s;
      position: absolute;
      width: var(--length);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(100, 202, 255, .26) 38%, rgba(218, 249, 255, .94));
      box-shadow: 0 0 7px rgba(84, 201, 255, .62);
      opacity: 0;
      transform: rotate(var(--angle)) translate3d(0, 0, 0);
      transform-origin: 100% 50%;
    }
    .meteor::after {
      content: "";
      position: absolute;
      right: -1px;
      top: 50%;
      width: 3px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #f2feff;
      box-shadow: 0 0 6px 2px rgba(137, 228, 255, .82);
      transform: translateY(-50%);
    }
    .meteor:nth-child(1) { top: 12%; left: 64%; --length: 146px; --duration: 11s; --delay: -4s; }
    .meteor:nth-child(2) { top: 23%; left: 79%; --length: 86px; --angle: -31deg; --duration: 14s; --delay: -10s; }
    .meteor:nth-child(3) { top: 8%; left: 92%; --length: 58px; --angle: -18deg; --duration: 17s; --delay: -8s; }
    .meteor:nth-child(4) { top: 68%; left: 88%; --length: 118px; --angle: -27deg; --duration: 13s; --delay: -2s; }
    .meteor:nth-child(5) { top: 43%; left: 96%; --length: 52px; --angle: -35deg; --duration: 10s; --delay: -7s; }
    .meteor:nth-child(6) { top: 82%; left: 72%; --length: 74px; --angle: -16deg; --duration: 16s; --delay: -13s; }
    .meteor:nth-child(7) { top: 31%; left: 58%; --length: 44px; --angle: -22deg; --duration: 19s; --delay: -15s; }
    main {
      position: relative;
      z-index: 1;
      width: min(680px, 92vw);
      min-height: 100vh;
      display: grid;
      align-content: center;
      padding: clamp(32px, 7vw, 96px);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #7ee9ff;
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 42px;
      height: 2px;
      background: linear-gradient(90deg, #ffb45b, #75ebff);
      box-shadow: 0 0 18px #59dfff;
    }
    .code {
      margin: 22px 0 0;
      color: transparent;
      font-size: clamp(88px, 18vw, 176px);
      font-weight: 900;
      line-height: .78;
      letter-spacing: -.08em;
      -webkit-text-stroke: 1px rgba(132, 232, 255, .72);
      text-shadow: 0 0 45px rgba(55, 196, 255, .18);
    }
    h1 {
      max-width: 620px;
      margin: 30px 0 14px;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.02;
      letter-spacing: -.035em;
    }
    .lead {
      max-width: 560px;
      margin: 0;
      color: #a9c4d1;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.75;
    }
    .telemetry {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      width: min(520px, 100%);
      margin-top: 34px;
      overflow: hidden;
      border: 1px solid rgba(113, 220, 255, .24);
      background: rgba(96, 216, 255, .18);
      backdrop-filter: blur(14px);
    }
    .telemetry div {
      min-width: 0;
      padding: 13px 15px;
      background: rgba(2, 12, 20, .76);
    }
    .telemetry span,
    .telemetry strong { display: block; }
    .telemetry span {
      margin-bottom: 5px;
      color: #688b9c;
      font: 700 9px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .14em;
    }
    .telemetry strong {
      overflow: hidden;
      color: #d9f7ff;
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-width: 168px;
      margin-top: 28px;
      padding: 12px 18px;
      border: 1px solid rgba(126, 233, 255, .58);
      color: #dffaff;
      background: linear-gradient(135deg, rgba(21, 79, 101, .62), rgba(7, 28, 42, .72));
      box-shadow: inset 0 0 22px rgba(90, 216, 255, .08), 0 0 28px rgba(56, 188, 255, .1);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover { border-color: #ffbd70; color: #fff3df; }
    footer {
      margin-top: 26px;
      color: #527080;
      font: 600 10px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    @media (max-width: 640px) {
      body { overflow: auto; background-position: 62% center; }
      main { min-height: 100svh; padding: 30px 24px; }
      .telemetry { grid-template-columns: 1fr; }
      .code { font-size: 92px; }
      .stream { left: 54%; width: 58vw; }
      .stream:nth-child(n+4),
      .meteor:nth-child(n+4),
      .mote:nth-child(n+8) { display: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .eyebrow::before { animation: pulse 2.8s ease-in-out infinite; }
      body::after { animation: gate-breathe 5.8s ease-in-out infinite; }
      .particles::before { animation: particle-drift 42s linear infinite; }
      .particles::after { animation: particle-drift-far 68s linear infinite reverse; }
      .dust::before { animation: dust-orbit 54s linear infinite; }
      .dust::after { animation: dust-breathe 7.5s ease-in-out infinite; }
      .mote { animation: mote-drift var(--duration) ease-in-out var(--delay) infinite; }
      .stream { animation: stream-flow 4.8s ease-in-out infinite; }
      .meteor { animation: meteor-pass var(--duration) linear var(--delay) infinite; }
      @keyframes pulse { 50% { opacity: .35; box-shadow: 0 0 4px #59dfff; } }
      @keyframes gate-breathe {
        50% { opacity: 1; filter: brightness(1.14) saturate(1.12); }
      }
      @keyframes particle-drift {
        to { transform: translate3d(5%, 7%, 0); }
      }
      @keyframes particle-drift-far {
        to { transform: scale(1.35) translate3d(-4%, 6%, 0); }
      }
      @keyframes dust-orbit {
        to { transform: translate3d(-3%, 4%, 0) rotate(.8deg); }
      }
      @keyframes dust-breathe {
        50% { opacity: .52; filter: blur(.15px) brightness(1.25); }
      }
      @keyframes mote-drift {
        0%, 100% { opacity: .12; transform: translate3d(0, 8px, 0) scale(.72); }
        38% { opacity: .7; transform: translate3d(-12px, -14px, 0) scale(1.18); }
        67% { opacity: .3; transform: translate3d(8px, -26px, 0) scale(.9); }
      }
      @keyframes stream-flow {
        0%, 12% { opacity: 0; clip-path: inset(0 100% 0 0); }
        34%, 68% { opacity: .74; clip-path: inset(0 0 0 0); }
        100% { opacity: 0; clip-path: inset(0 0 0 88%); }
      }
      @keyframes meteor-pass {
        0%, 72% { opacity: 0; transform: rotate(var(--angle)) translate3d(0, 0, 0) scaleX(.3); }
        74% { opacity: .92; }
        84%, 100% { opacity: 0; transform: rotate(var(--angle)) translate3d(-42vw, 0, 0) scaleX(1.08); }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .space-fx * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="space-fx" aria-hidden="true">
    <div class="particles"></div>
    <div class="dust"></div>
    <div class="gate-motes">
      <i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i>
      <i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i>

  </div>
