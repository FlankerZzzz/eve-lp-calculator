<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>航道权限拒绝 · 403</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #02060b;
      color: #eaf8ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(2, 6, 11, .98) 0%, rgba(2, 8, 15, .88) 36%, rgba(3, 12, 20, .22) 72%),
        url('/__security/assets/deep-space-checkpoint-v2.png') center / cover no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(118, 226, 255, .025) 0 1px, transparent 1px 5px),
        radial-gradient(circle at 78% 45%, transparent 0 18%, rgba(1, 4, 8, .35) 64%, rgba(1, 4, 8, .9) 100%);
    }
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 82% 44%, rgba(174, 241, 255, .22) 0, rgba(61, 186, 255, .08) 17%, transparent 38%),
        linear-gradient(103deg, transparent 0 50%, rgba(120, 229, 255, .045) 52%, transparent 54%);
      mix-blend-mode: screen;
      opacity: .76;
    }
    .space-fx,
    .space-fx > div {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particles::before,
    .particles::after {
      content: "";
      position: absolute;
      inset: -18%;
      background-image:
        radial-gradient(circle, rgba(205, 246, 255, .72) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(95, 201, 255, .45) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255, 190, 112, .32) 0 1px, transparent 1.5px);
      background-position: 11px 17px, 43px 71px, 89px 31px;
      background-size: 113px 107px, 167px 151px, 227px 211px;
      opacity: .36;
    }
    .particles::after {
      filter: blur(.5px);
      opacity: .26;
      transform: scale(1.35);
    }
    .stream {
      position: absolute;
      left: 42%;
      width: 48vw;
      height: 1px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(67, 193, 255, .18) 24%, rgba(188, 245, 255, .86) 64%, transparent);
      box-shadow: 0 0 8px rgba(78, 205, 255, .5), 0 0 22px rgba(54, 165, 255, .22);
      opacity: 0;
      transform-origin: 100% 50%;
    }
    .stream:nth-child(1) { top: 39%; transform: rotate(5deg); }
    .stream:nth-child(2) { top: 48%; transform: rotate(-2deg); animation-delay: -1.8s; }
    .stream:nth-child(3) { top: 57%; transform: rotate(-8deg); animation-delay: -3.4s; }
    .engine-effects {
      position: fixed;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .engine-jet { --engine-delay: 0s; }
    .engine-jet:nth-of-type(2) { --engine-delay: -.57s; }
    .engine-jet:nth-of-type(3) { --engine-delay: -1.08s; }
    .engine-pixels {
      opacity: .14;
      filter: brightness(1.45) saturate(1.25) drop-shadow(0 0 5px rgba(80, 205, 255, .34));
    }
    .engine-plume {
      fill: url(#engine-plasma);
      filter: url(#engine-soft);
      opacity: .2;
      transform-box: fill-box;
      transform-origin: right center;
    }
    .engine-nozzle {
      fill: #9cefff;
      filter: url(#engine-nozzle-glow);
      opacity: .16;
      transform-box: fill-box;
      transform-origin: center;
    }
    .meteor {
      position: absolute;
      top: 12%;
      left: 58%;
      width: 130px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(151, 226, 255, .9));
      box-shadow: 0 0 8px rgba(84, 201, 255, .7);
      opacity: 0;
      transform: rotate(-28deg) translate3d(0, 0, 0);
    }
    .meteor:nth-child(2) { top: 22%; left: 72%; width: 82px; animation-delay: -3.6s; }
    .meteor:nth-child(3) { top: 8%; left: 87%; width: 58px; animation-delay: -6.2s; }
    main {
      position: relative;
      z-index: 1;
      width: min(680px, 92vw);
      min-height: 100vh;
      display: grid;
      align-content: center;
      padding: clamp(32px, 7vw, 96px);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #7ee9ff;
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 42px;
      height: 2px;
      background: linear-gradient(90deg, #ffb45b, #75ebff);
      box-shadow: 0 0 18px #59dfff;
    }
    .code {
      margin: 22px 0 0;
      color: transparent;
      font-size: clamp(88px, 18vw, 176px);
      font-weight: 900;
      line-height: .78;
      letter-spacing: -.08em;
      -webkit-text-stroke: 1px rgba(132, 232, 255, .72);
      text-shadow: 0 0 45px rgba(55, 196, 255, .18);
    }
    h1 {
      max-width: 620px;
      margin: 30px 0 14px;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.02;
      letter-spacing: -.035em;
    }
    .lead {
      max-width: 560px;
      margin: 0;
      color: #a9c4d1;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.75;
    }
    .telemetry {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      width: min(520px, 100%);
      margin-top: 34px;
      overflow: hidden;
      border: 1px solid rgba(113, 220, 255, .24);
      background: rgba(96, 216, 255, .18);
      backdrop-filter: blur(14px);
    }
    .telemetry div {
      min-width: 0;
      padding: 13px 15px;
      background: rgba(2, 12, 20, .76);
    }
    .telemetry span,
    .telemetry strong { display: block; }
    .telemetry span {
      margin-bottom: 5px;
      color: #688b9c;
      font: 700 9px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .14em;
    }
    .telemetry strong {
      overflow: hidden;
      color: #d9f7ff;
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-width: 168px;
      margin-top: 28px;
      padding: 12px 18px;
      border: 1px solid rgba(126, 233, 255, .58);
      color: #dffaff;
      background: linear-gradient(135deg, rgba(21, 79, 101, .62), rgba(7, 28, 42, .72));
      box-shadow: inset 0 0 22px rgba(90, 216, 255, .08), 0 0 28px rgba(56, 188, 255, .1);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover { border-color: #ffbd70; color: #fff3df; }
    footer {
      margin-top: 26px;
      color: #527080;
      font: 600 10px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    @media (max-width: 640px) {
      body { overflow: auto; background-position: 62% center; }
      main { min-height: 100svh; padding: 30px 24px; }
      .telemetry { grid-template-columns: 1fr; }
      .code { font-size: 92px; }
      .engine-effects { display: none; }
      .stream { left: 54%; width: 58vw; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .eyebrow::before { animation: pulse 2.8s ease-in-out infinite; }
      body::after { animation: gate-breathe 5.8s ease-in-out infinite; }
      .particles::before { animation: particle-drift 42s linear infinite; }
      .particles::after { animation: particle-drift-far 68s linear infinite reverse; }
      .stream { animation: stream-flow 4.8s ease-in-out infinite; }
      .engine-pixels { animation: original-plume-flicker 1.65s ease-in-out var(--engine-delay) infinite; }
      .engine-plume { animation: plume-breathe 1.85s ease-in-out var(--engine-delay) infinite; }
      .engine-nozzle { animation: nozzle-pulse 1.1s ease-in-out var(--engine-delay) infinite; }
      .meteor { animation: meteor-pass 8.5s linear infinite; }
      @keyframes pulse { 50% { opacity: .35; box-shadow: 0 0 4px #59dfff; } }
      @keyframes gate-breathe {
        50% { opacity: 1; filter: brightness(1.14) saturate(1.12); }
      }
      @keyframes particle-drift {
        to { transform: translate3d(5%, 7%, 0); }
      }
      @keyframes particle-drift-far {
        to { transform: scale(1.35) translate3d(-4%, 6%, 0); }
      }
      @keyframes stream-flow {
        0%, 12% { opacity: 0; clip-path: inset(0 100% 0 0); }
        34%, 68% { opacity: .74; clip-path: inset(0 0 0 0); }
        100% { opacity: 0; clip-path: inset(0 0 0 88%); }
      }
      @keyframes plume-breathe {
        0%, 100% { opacity: .12; transform: scaleX(.96) scaleY(.86); }
        38% { opacity: .34; transform: scaleX(1.035) scaleY(1.08); }
        62% { opacity: .2; transform: scaleX(.985) scaleY(.94); }
        82% { opacity: .4; transform: scaleX(1.055) scaleY(1.02); }
      }
      @keyframes original-plume-flicker {
        0%, 100% { opacity: .08; filter: brightness(1.2) saturate(1.1) drop-shadow(0 0 3px rgba(80, 205, 255, .2)); }
        34% { opacity: .34; filter: brightness(1.8) saturate(1.45) drop-shadow(0 0 9px rgba(80, 205, 255, .52)); }
        61% { opacity: .16; filter: brightness(1.4) saturate(1.2) drop-shadow(0 0 5px rgba(80, 205, 255, .3)); }
        83% { opacity: .4; filter: brightness(1.95) saturate(1.55) drop-shadow(0 0 11px rgba(80, 205, 255, .6)); }
      }
      @keyframes nozzle-pulse {
        0%, 100% { opacity: .1; transform: scale(.88); }
        48% { opacity: .42; transform: scale(1.08); }
      }
      @keyframes meteor-pass {
        0%, 70% { opacity: 0; transform: rotate(-28deg) translate3d(0, 0, 0); }
        73% { opacity: .9; }
        82%, 100% { opacity: 0; transform: rotate(-28deg) translate3d(-34vw, 0, 0); }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .space-fx * { animation: none !important; }
    }
  </style>
</head>
<body>
  <svg class="engine-effects" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <image id="engine-art-source" href="/__security/assets/deep-space-checkpoint-v2.png" width="1672" height="941"/>
      <clipPath id="engine-tail-one">
        <path d="M270 482 C378 466 499 451 579 452 L579 472 C497 483 377 510 270 518Z"/>
      </clipPath>
      <clipPath id="engine-tail-two">
        <path d="M305 548 C419 526 540 511 619 516 L619 537 C536 547 417 580 305 585Z"/>
      </clipPath>
      <clipPath id="engine-tail-three">
        <path d="M423 620 C548 594 682 575 771 578 L771 603 C680 613 548 650 423 660Z"/>
      </clipPath>
      <linearGradient id="engine-plasma" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#218cff" stop-opacity="0"/>
        <stop offset=".44" stop-color="#2a9cff" stop-opacity=".2"/>
        <stop offset=".82" stop-color="#56d8ff" stop-opacity=".58"/>

      <filter id="engine-soft" x="-20%" y="-80%" width="145%" height="260%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
      <filter id="engine-nozzle-glow" x="-300%" y="-300%" width="700%" height="700%">
        <feGaussianBlur stdDeviation="3"/>
      </filter>
    </defs>
    <g class="engine-jet">
      <use class="engine-pixels" href="#engine-art-source" clip-path="url(#engine-tail-one)"/>
      <path class="engine-plume" d="M354 488 C423 471 507 456 570 456 C516 472 433 492 354 501 C343 498 344 492 354 488Z"/>
      <ellipse class="engine-nozzle" cx="570" cy="461" rx="5" ry="3"/>
    </g>
    <g class="engine-jet">
      <use class="engine-pixels" href="#engine-art-source" clip-path="url(#engine-tail-two)"/>
      <path class="engine-plume" d="M388 552 C457 532 548 517 610 521 C553 537 468 560 388 568 C376 564 377 556 388 552Z"/>
      <ellipse class="engine-nozzle" cx="610" cy="527" rx="5" ry="3"/>
    </g>
    <g class="engine-jet">
      <use class="engine-pixels" href="#engine-art-source" clip-path="url(#engine-tail-three)"/>
      <path class="engine-plume" d="M505 619 C584 598 695 579 761 583 C697 603 597 627 505 637 C492 633 493 624 505 619Z"/>
      <ellipse class="engine-nozzle" cx="761" cy="590" rx="6" ry="4"/>
    </g>
  </svg>
  <div class="space-fx" aria-hidden="true">
    <div class="particles"></div>
    <div class="streams">
      <i class="stream"></i><i class="stream"></i><i class="stream"></i>
    </div>
    <div class="meteors">
      <i class="meteor"></i><i class="meteor"></i><i class="meteor"></i>
    </div>
  </div>
  <main>
    <div class="eyebrow">Jump Gate Control · Sector 42981</div>
    <div class="code" aria-hidden="true">403</div>
    <h1>跃迁航道未获授权</h1>
    <p class="lead">你的信标来自受信任星域之外。同步控制台仅向本地舰队网络开放；当前航线已被星门安全协议拦截。</p>
    <section class="telemetry" aria-label="访问诊断">
      <div><span>GATE STATUS</span><strong>ACCESS DENIED</strong></div>
      <div><span>ROUTE CLASS</span><strong>SYNC CONTROL</strong></div>
      <div><span>PROTOCOL</span><strong>LOCAL FLEET ONLY</strong></div>
    </section>
    <a href="/">返回公共星图</a>
    <footer>NX-42981 · Navigation firewall active · No hostile action recorded</footer>
  </main>
</body>
</html>
