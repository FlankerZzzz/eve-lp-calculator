services:
  nginx:
    build:
      context: ./nginx
    image: eve-lp-calculator-nginx
    container_name: eve-lp-nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "42981:42981"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  web:
    image: eve-lp-calculator-eve-lp-calculator
    build:
      context: .
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    container_name: eve-lp-web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["node", "scripts/web.mjs"]
    expose:
      - "3000"
    environment:
      ESI_BASE_URL: https://ali-esi.evepc.163.com
      V2_SQLITE_PATH: /v2/eve-v2.db
      V2_LOG_PATH: /v2/logs
      SYNC_ADMIN_TOKEN: ${SYNC_ADMIN_TOKEN:-}
    volumes:
      - ./docker-data/v2:/v2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - frontend
      - backend

  sync:
    image: eve-lp-calculator-eve-lp-calculator
    container_name: eve-lp-sync
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["node", "scripts/v2/worker.mjs"]
    environment:
      V2_SQLITE_PATH: /v2/eve-v2.db
      V2_LOG_PATH: /v2/logs
      V2_REQUEST_RATE: "5"
      V2_REQUEST_CONCURRENCY: "8"
      V2_HISTORY_REQUEST_RATE: "1"
      V2_HISTORY_REQUEST_CONCURRENCY: "2"
      ESI_BASE_URL: https://ali-esi.evepc.163.com
    volumes:
      - ./docker-data/v2:/v2
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "import {DatabaseSync} from 'node:sqlite';const d=new DatabaseSync(process.env.V2_SQLITE_PATH,{readOnly:true});const r=d.prepare(\"SELECT value FROM runtime_state WHERE key='worker'\").get();d.close();const w=r?JSON.parse(r.value):null;if(!w||Date.now()-w.heartbeat>30000)process.exit(1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
