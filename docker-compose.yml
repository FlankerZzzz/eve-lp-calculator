services:
  nginx:
    build:
      context: ./nginx
    image: eve-lp-calculator-nginx
    container_name: eve-lp-nginx
    restart: unless-stopped
    ports:
      - "42981:42981"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  web:
    image: eve-lp-calculator-eve-lp-calculator
    build:
      context: .
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    container_name: eve-lp-web
    restart: unless-stopped
    command: ["node", "scripts/web.mjs"]
    expose:
      - "3000"
    environment:
      ESI_BASE_URL: https://ali-esi.evepc.163.com
      SQLITE_RUNTIME: "1"
      SQLITE_PATH: /data/eve-lp.db
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_PATH: /app/.wrangler/logs
      MINIFLARE_REGISTRY_PATH: /app/.wrangler/registry
    volumes:
      - ./docker-data/wrangler:/app/.wrangler
      - ./docker-data/sqlite:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - frontend
      - backend

  sync:
    image: eve-lp-calculator-eve-lp-calculator
    container_name: eve-lp-sync
    restart: unless-stopped
    command: ["node", "scripts/sync-daemon.mjs"]
    environment:
      SYNC_BASE_URL: http://web:3000
      SQLITE_RUNTIME: "1"
      SQLITE_PATH: /data/eve-lp.db
      ESI_BASE_URL: https://ali-esi.evepc.163.com
    volumes:
      - ./docker-data/sqlite:/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const { DatabaseSync } = require('node:sqlite'); const db = new DatabaseSync('/data/eve-lp.db'); const row = db.prepare('SELECT heartbeat_at FROM contract_sync_state WHERE id=1').get(); db.close(); if (!row?.heartbeat_at || Date.now() - Date.parse(row.heartbeat_at) > 300000) process.exit(1); fetch('http://web:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
